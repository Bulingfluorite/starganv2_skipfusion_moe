task: 3
method: stargan_v2
task_name: stargan_v2_moe_film
model:
  img_size: 512
  style_dim: 64
  latent_dim: 16
  num_domains: 15
  max_conv_dim: 512
  input_nc: 1
  use_unet: true
  use_lap_attn: true
  multiscale_disc: true
  use_film: true
  film_hidden: 64
  use_dynamic_film: false
  use_moe_film: true

domains: [0.1T, 1.5T, 3T, 5T, 7T]
modalities: [T1W, T2W, T2FLAIR]

data:
  modalities: [T1W, T2W, T2FLAIR]
  crop_size: [512, 512]

pretrain:
  total_iters: 60000
  batch_size: 8
  lr: 0.0001
  f_lr: 1.0e-06
  lr_schedule: cosine
  lr_decay_start: 40000
  lambda_cyc: 1.0
  lambda_cyc_lpips: 0.015
  lambda_cyc_ssim: 0.1
  lambda_freq: 0.15
  lambda_mssim: 0.1
  lambda_reg: 5.0
  lambda_lpips_direct: 0.05
  ds_iter: 30000
  use_amp: false
  lambda_seg: 0.01

auto_save_best:
  enabled: true
  alpha: 2.0
  min_step: 30000
  top_k_checkpoints: 3
